<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Illustrative fabric surface variations</title>
<desc id="desc">Four stylized textile swatches illustrating a clean woven surface, an irregular yarn, a stain and a small hole. This is an editorial illustration, not a model prediction or dataset sample.</desc>
<defs>
  <pattern id="weave" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#e7dfcf"/>
    <path d="M0 4H18M0 13H18" stroke="#c7bca8" stroke-width="3" opacity=".8"/>
    <path d="M4 0V18M13 0V18" stroke="#f7f2e8" stroke-width="3" opacity=".85"/>
  </pattern>
  <pattern id="fineWeave" width="12" height="12" patternUnits="userSpaceOnUse">
    <rect width="12" height="12" fill="#d9d3c6"/>
    <path d="M0 3H12M0 9H12" stroke="#b7b09f" stroke-width="1.6"/>
    <path d="M3 0V12M9 0V12" stroke="#f0eadd" stroke-width="1.6"/>
  </pattern>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4efe5"/><stop offset="1" stop-color="#d6cdbd"/></linearGradient>
  <linearGradient id="stain" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8e7156" stop-opacity=".15"/><stop offset=".55" stop-color="#986e51" stop-opacity=".55"/><stop offset="1" stop-color="#6c513f" stop-opacity=".18"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="clip1"><rect x="34" y="34" width="548" height="300" rx="18"/></clipPath>
  <clipPath id="clip2"><rect x="618" y="34" width="548" height="300" rx="18"/></clipPath>
  <clipPath id="clip3"><rect x="34" y="386" width="548" height="300" rx="18"/></clipPath>
  <clipPath id="clip4"><rect x="618" y="386" width="548" height="300" rx="18"/></clipPath>
</defs>
<rect width="1200" height="720" fill="#f7f6f0"/>
<g clip-path="url(#clip1)">
  <rect x="34" y="34" width="548" height="300" fill="url(#weave)"/>
  <path d="M50 70C165 40 242 118 353 82S513 48 590 87" fill="none" stroke="#fff9ef" stroke-width="12" opacity=".35"/>
  <path d="M34 274C170 236 255 302 390 267S524 240 582 255" fill="none" stroke="#ac9f8b" stroke-width="5" opacity=".2"/>
</g>

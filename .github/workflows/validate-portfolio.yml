name: Validate portfolio

on:
  push:
    paths:
      - "portfolio/**"
      - ".github/workflows/validate-portfolio.yml"
  pull_request:
    paths:
      - "portfolio/**"
      - ".github/workflows/validate-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check portfolio JavaScript syntax
        run: node --check portfolio/site.js
      - name: Check portfolio HTML and anchors
        run: python portfolio/scripts/check_site.py

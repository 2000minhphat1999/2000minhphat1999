name: Validate React portfolio

on:
  push:
    paths:
      - "portfolio/**"
      - ".github/workflows/validate-portfolio.yml"
  pull_request:
    paths:
      - "portfolio/**"
      - ".github/workflows/validate-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: portfolio
        run: npm install
      - name: Build and validate production output
        working-directory: portfolio
        run: npm run check